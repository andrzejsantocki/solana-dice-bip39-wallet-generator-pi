    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="#080b14"/>
  <rect width="1400" height="900" fill="url(#glow)"/>
  <g opacity="0.16" stroke="#ffffff" stroke-width="1">
    <path d="M0 170H1400M0 310H1400M0 450H1400M0 590H1400M0 730H1400"/>
    <path d="M180 0V900M390 0V900M600 0V900M810 0V900M1020 0V900M1230 0V900"/>
  </g>

  <text x="92" y="112" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.5">Solana Dice BIP39 Wallet Generator</text>
  <text x="96" y="154" fill="#a9b6ce" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Air-gapped dice entropy → BIP39 seed → SLIP-0010 Ed25519 → Solana address</text>

  <g transform="translate(92 185)" filter="url(#shadow)">
    <rect width="1216" height="660" rx="22" fill="#0d1222" stroke="#26314c"/>
    <rect width="1216" height="48" rx="22" fill="#151b2e"/>
    <circle cx="31" cy="24" r="7" fill="#ff5f56"/>
    <circle cx="55" cy="24" r="7" fill="#ffbd2e"/>
    <circle cx="79" cy="24" r="7" fill="#27c93f"/>
    <text x="110" y="31" fill="#bcc7dc" font-family="JetBrains Mono, Consolas, monospace" font-size="15">offline ceremony / explicit derivation paths</text>
    <rect x="0" y="48" width="1216" height="4" fill="url(#bar)"/>

    <g font-family="JetBrains Mono, Consolas, monospace" font-size="20">
      <text x="42" y="98" fill="#7dd3fc">$ python generate_wallet.py --entropy-mode von-neumann --words 24</text>
      <text x="42" y="145" fill="#f8fafc" font-weight="700">Wallet Dice</text>
      <text x="42" y="177" fill="#cbd5e1">=== Offline dice-based Solana wallet generator ===</text>

      <text x="42" y="230" fill="#f8fafc">Need 256 unbiased bits from physical dice.</text>
      <text x="42" y="264" fill="#94a3b8">Von Neumann debiasing: ties discarded, non-tie pairs emit bits.</text>

      <rect x="42" y="298" width="520" height="128" rx="14" fill="#111827" stroke="#1f2a44"/>
      <text x="68" y="336" fill="#14f195" font-weight="700">DICE ANOMALY SCREEN</text>
      <text x="68" y="372" fill="#e2e8f0">Verdict: NO_ANOMALY</text>
      <text x="68" y="404" fill="#94a3b8">No obvious anomaly; not entropy proof</text>

      <rect x="608" y="298" width="520" height="128" rx="14" fill="#151023" stroke="#36235d"/>
      <text x="634" y="336" fill="#c084fc" font-weight="700">CEREMONY FLOW</text>
      <text x="634" y="372" fill="#e2e8f0">Mnemonic shown once</text>
      <text x="634" y="404" fill="#94a3b8">Restore-check before funding</text>

      <text x="42" y="482" fill="#facc15">MNEMONIC: [24 BIP39 words hidden]</text>
      <text x="42" y="526" fill="#a7f3d0">Ready for independent restore verification.</text>

      <rect x="42" y="552" width="1086" height="84" rx="14" fill="#071a16" stroke="#14532d"/>
      <text x="68" y="588" fill="#14f195" font-weight="700">SOL m/44'/501'/0'/0'</text>
      <text x="68" y="620" fill="#d1fae5">Address: HAgk14JpMQLgt6rVgv7cBQFJWFto5Dqxi472uT3DKpqk</text>
    </g>
  </g>

  <g transform="translate(92 850)" font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="0" y="0" width="1216" height="46" rx="23" fill="#0d1222" stroke="#26314c" opacity="0.95"/>
    <text x="28" y="30" font-size="18" fill="#9fb0ce">Hash-verified local wheels · no network · explicit Solana path · published golden-vector tests</text>
