<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <radialGradient id="glow" cx="78%" cy="18%" r="55%">
      <stop offset="0" stop-color="#14f195" stop-opacity="0.30"/>
      <stop offset="0.42" stop-color="#9945ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#14f195"/>
      <stop offset="0.55" stop-color="#80ecff"/>
      <stop offset="1" stop-color="#9945ff"/>
