name: tests

on:
  push:
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies from PyPI
        shell: bash
        run: python -m pip install mnemonic==0.21 pynacl==1.6.2 cffi==2.1.1 pycparser==3.0
      - name: Run verification suite
        shell: bash
        run: python -m unittest discover -v -s verification -p 'test*.py'
